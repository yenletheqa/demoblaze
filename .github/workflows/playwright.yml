name: DemoBlaze Playwright Tests

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  ui-tests:
    name: UI Tests (${{ matrix.project }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        project: [chromium, firefox]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run UI Login tests
        run: npx playwright test tests/ui/login --project=${{ matrix.project }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-ui-${{ matrix.project }}
          path: playwright-report/

  api-tests:
    name: API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run API tests
        run: npx playwright test tests/api/product

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-api
          path: playwright-report/